<script>
'use strict';

// ============================================================
// Minimal test runner — no framework, no deps.
// Usage:
//   group('name', () => { test('foo', () => assert.eq(1+1, 2)); });
// ============================================================

const __results = [];
let __currentGroup = 'misc';
let __failed = 0;
let __passed = 0;

function group(name, fn) {
    const previous = __currentGroup;
    __currentGroup = name;
    try { fn(); }
    catch (e) {
        __failed++;
        __results.push({ group: name, name: '<group threw>', pass: false, err: String(e && e.stack || e) });
    }
    __currentGroup = previous;
}

function test(name, fn) {
    try {
        fn();
        __passed++;
        __results.push({ group: __currentGroup, name, pass: true });
    } catch (e) {
        __failed++;
        __results.push({ group: __currentGroup, name, pass: false, err: String(e && e.stack || e) });
    }
}

const assert = {
    ok(cond, msg) {
        if (!cond) throw new Error(msg || 'expected truthy');
    },
    eq(actual, expected, msg) {
        if (actual !== expected) {
            throw new Error((msg ? msg + ' — ' : '') + 'expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
        }
    },
    near(actual, expected, eps, msg) {
        if (!(Math.abs(actual - expected) <= eps)) {
            throw new Error((msg ? msg + ' — ' : '') + 'expected ' + expected + ' (±' + eps + '), got ' + actual);
        }
    },
    deepEq(actual, expected, msg) {
        const a = JSON.stringify(actual);
        const b = JSON.stringify(expected);
        if (a !== b) throw new Error((msg ? msg + ' — ' : '') + 'expected ' + b + ', got ' + a);
    },
    throws(fn, msg) {
        let threw = false;
        try { fn(); } catch (_) { threw = true; }
        if (!threw) throw new Error(msg || 'expected throw');
    }
};

// ============================================================
// Load modules under test (load order matters — app-boot mirrors production order)
// ============================================================

function loadScript(src) {
    return new Promise((resolve, reject) => {
        const tag = document.createElement('script');
        tag.src = src;
        tag.onload = () => resolve();
        tag.onerror = () => reject(new Error('Failed to load ' + src));
        document.head.appendChild(tag);
    });
}

async function loadModules() {
    await loadScript('js/trainer-helpers.js');
    await loadScript('js/mxl-parser.js');
    await loadScript('js/transpose/transpose-engine.js');
    await loadScript('js/trainer-timing.js');
    await loadScript('js/staff-id.js');
    await loadScript('js/led-preview.js');
    await loadScript('js/midi-routing.js');
    window.AppState = {
        pseudoFullscreenActive: false,
        fullscreenOnPlay: false,
        mode: 'realtime',
        modeSettings: {
            realtime: { practice: { left: true, right: true }, playback: { left: true, right: true } },
            wait: { practice: { left: true, right: true }, playback: { left: false, right: false } },
            follow: { practice: { left: false, right: true }, playback: { left: true, right: false } }
        },
        practice: { left: true, right: true },
        playback: { left: true, right: true },
        hands: { left: 2, right: 1 },
        isPlaying: false,
        countInActive: false,
        pendingAudio: [{ stub: 1 }],
        followAdvanceInfo: { stub: 1 },
        currentExpectedContext: { stub: 1 },
        earlyGraceReservations: new Map([[60, { stub: 1 }]]),
        isAudioBusy: true,
        expectedNotes: [{ stub: 1 }],
        activeNoteLabels: [{ stub: 1 }],
        realtimeWrongPressInCurrentContext: true,
        preExpectedHeldNotes: new Set([60, 64]),
        lastLedPreviewEvents: [{ stub: 1 }],
        ledPreviewTraversalIndex: 5,
        ledOutputMode: 'none',
        scoreNoteLabels: [],
        score: { correct: 0, wrong: 0 },
        anchorTime: 0,
        baseBpm: 120,
        speedPercent: 1
    };

    // Transport globals (mocks — only what's needed by the functions under test)
    window.Tone = { Transport: { start: () => {}, stop: () => {}, pause: () => {}, bpm: { value: 120 } }, now: () => 0 };
    window.osmd = { cursor: { show: () => {}, reset: () => {}, Iterator: { CurrentMeasureIndex: 0 } }, IsReadyToRender: () => false };
    window.pianoSampler = { releaseAll: () => {} };
    window.lowLatencyPlaybackSynth = { releaseAll: () => {} };
    window.midiAccess = null;
    window.getMidiOutStatus = (b) => b;
    window.clearVisuals = () => {};
    window.refreshScoreNoteLabelsFromCursor = () => {};
    window.renderFeedbackOverlay = () => {};
    window.clearScheduledMetronomeEvents = () => {};
    window.stopWaitModeMetronome = () => {};
    window.clearTempoVisualPulse = () => {};
    window.applyToneLatencyProfileForMode = () => {};
    window.wipeHardwareLEDs = () => {};
    window.WLEDController = { forceClear: () => Promise.resolve() };
    window.GeometryEngine = { clearSvgFeedback: () => {} };
    window.updateScoreDisplay = () => {};
    window.preserveMusicAreaScroll = (cb) => cb();
    window.ensureLedPreviewTimelineBuilt = () => {};
    window.doCountInAndStart = (cb) => cb();
    window.handleAutoScroll = () => {};
    window.startWaitModeMetronome = () => {};
    window.playbackLoop = () => {};
    window.hideToolbarPanels = () => {};
    window.ensureLiveAudioReady = () => Promise.resolve();

    await loadScript('js/trainer-mode.js');
    await loadScript('js/fullscreen.js');
    await loadScript('js/transport.js');
    await loadScript('js/looper-state.js');
    await loadScript('js/playback.js');
    await loadScript('js/keyboard-input.js');
    await loadScript('assets/js/opensheetmusicdisplay.min.js');
}

// ============================================================
// Tests
// ============================================================

function runTests() {
    __results.length = 0;
    __asyncPromises.length = 0;
    __failed = 0; __passed = 0;

    // ---- helpers used by tests below (must be defined before any test() call) ----
    const CRC_TABLE = (() => {
        const t = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
            let c = n;
            for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
            t[n] = c >>> 0;
        }
        return t;
    })();

    function crc32(bytes) {
        let c = 0xffffffff;
        for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
        return (c ^ 0xffffffff) >>> 0;
    }

    // ---- trainer-helpers.js ----
    group('PTHelpers', () => {
        test('parseStaffAssignmentValue: positive integer', () => {
            assert.eq(window.PTHelpers.parseStaffAssignmentValue('3'), 3);
        });
        test('parseStaffAssignmentValue: empty/null/dash → null', () => {
            assert.eq(window.PTHelpers.parseStaffAssignmentValue(''), null);
            assert.eq(window.PTHelpers.parseStaffAssignmentValue('-'), null);
            assert.eq(window.PTHelpers.parseStaffAssignmentValue(null), null);
            assert.eq(window.PTHelpers.parseStaffAssignmentValue(undefined), null);
        });
        test('parseStaffAssignmentValue: non-numeric → null', () => {
            assert.eq(window.PTHelpers.parseStaffAssignmentValue('abc'), null);
            assert.eq(window.PTHelpers.parseStaffAssignmentValue('0'), null);
            assert.eq(window.PTHelpers.parseStaffAssignmentValue('-2'), null);
        });
        test('formatStaffAssignmentValue: round-trip', () => {
            assert.eq(window.PTHelpers.formatStaffAssignmentValue('5'), '5');
            assert.eq(window.PTHelpers.formatStaffAssignmentValue(''), '');
            assert.eq(window.PTHelpers.formatStaffAssignmentValue('x'), '');
            assert.eq(window.PTHelpers.formatStaffAssignmentValue(7), '7');
        });
        test('getScoreFileTypeFromName: by extension', () => {
            assert.eq(window.PTHelpers.getScoreFileTypeFromName('a.xml'), 'xml');
            assert.eq(window.PTHelpers.getScoreFileTypeFromName('A.MUSICXML'), 'musicxml');
            assert.eq(window.PTHelpers.getScoreFileTypeFromName('b.mxl'), 'mxl');
            assert.eq(window.PTHelpers.getScoreFileTypeFromName('note.txt'), 'xml');
            assert.eq(window.PTHelpers.getScoreFileTypeFromName(''), 'xml');
        });
        test('getScoreDisplayTitle: strips extension', () => {
            assert.eq(window.PTHelpers.getScoreDisplayTitle('Song.MUSICXML', 'fallback'), 'Song');
            assert.eq(window.PTHelpers.getScoreDisplayTitle('song.xml', 'Untitled'), 'song');
            assert.eq(window.PTHelpers.getScoreDisplayTitle('song.mxl', 'Untitled'), 'song');
            assert.eq(window.PTHelpers.getScoreDisplayTitle('', 'Untitled'), 'Untitled');
            assert.eq(window.PTHelpers.getScoreDisplayTitle('   .xml  ', 'X'), 'X');
        });
        test('getMetronomeMidiVelocity: scales with volume', () => {
            assert.eq(window.PTHelpers.getMetronomeMidiVelocity(100, 100), 100);
            assert.eq(window.PTHelpers.getMetronomeMidiVelocity(50, 100), 50);
            assert.eq(window.PTHelpers.getMetronomeMidiVelocity(0, 100), 1);
            assert.eq(window.PTHelpers.getMetronomeMidiVelocity(200, 100), 100);
            assert.eq(window.PTHelpers.getMetronomeMidiVelocity(50, 200), 64);
            assert.eq(window.PTHelpers.getMetronomeMidiVelocity('bad', 100), 1);
        });

        test('normalizeZoomValue: clamps to 50-150', () => {
            assert.eq(window.PTHelpers.normalizeZoomValue(100), 100);
            assert.eq(window.PTHelpers.normalizeZoomValue(0), 50);
            assert.eq(window.PTHelpers.normalizeZoomValue(999), 150);
            assert.eq(window.PTHelpers.normalizeZoomValue(50), 50);
            assert.eq(window.PTHelpers.normalizeZoomValue(150), 150);
        });

        test('normalizeZoomValue: parses strings and rejects non-numeric', () => {
            assert.eq(window.PTHelpers.normalizeZoomValue('75'), 75);
            assert.eq(window.PTHelpers.normalizeZoomValue('200'), 150);
            assert.eq(window.PTHelpers.normalizeZoomValue('abc'), null);
            assert.eq(window.PTHelpers.normalizeZoomValue(''), null);
            assert.eq(window.PTHelpers.normalizeZoomValue(null), null);
        });

        test('getMidiOutExpressionValue: scales percent → MIDI 0-127', () => {
            assert.eq(window.PTHelpers.getMidiOutExpressionValue(0), 0);
            assert.eq(window.PTHelpers.getMidiOutExpressionValue(100), 127);
            assert.eq(window.PTHelpers.getMidiOutExpressionValue(50), 64);
            assert.eq(window.PTHelpers.getMidiOutExpressionValue(150), 127, 'clamps high');
            assert.eq(window.PTHelpers.getMidiOutExpressionValue(-10), 0, 'clamps low');
            assert.eq(window.PTHelpers.getMidiOutExpressionValue('bad'), 0);
        });

        test('getNoteTie: null when note has no tie', () => {
            assert.eq(window.PTHelpers.getNoteTie(null), null);
            assert.eq(window.PTHelpers.getNoteTie(undefined), null);
            assert.eq(window.PTHelpers.getNoteTie({}), null);
            assert.eq(window.PTHelpers.getNoteTie({ tie: { Notes: [] } }), null);
        });

        test('getNoteTie: exposes StartNote/EndNote/Notes/NextNote', () => {
            const a = { halfTone: 60 }, b = { halfTone: 60 }, c = { halfTone: 60 };
            const tieObj = { Notes: [a, b, c] };
            a.tie = b.tie = c.tie = tieObj;
            const tie = window.PTHelpers.getNoteTie(a);
            assert.eq(tie.StartNote, a);
            assert.eq(tie.EndNote, c);
            assert.eq(tie.Notes.length, 3);
            assert.eq(tie.NextNote, b);
            assert.eq(window.PTHelpers.getNoteTie(b).NextNote, c);
            assert.eq(window.PTHelpers.getNoteTie(c).NextNote, null);
        });
    });

    // ---- playback.js (seams extracted from trainer-core.js playbackLoop) ----
    group('PTPlayback', () => {
        test('computeWaitSeconds: matches beats * 60 / (bpm * speedPercent)', () => {
            assert.near(window.PTPlayback.computeWaitSeconds(1, 120, 1), 0.5, 1e-9);
            assert.near(window.PTPlayback.computeWaitSeconds(2, 120, 1), 1.0, 1e-9);
            assert.near(window.PTPlayback.computeWaitSeconds(1, 60, 1), 1.0, 1e-9);
        });
        test('computeWaitSeconds: speedPercent scales inversely', () => {
            assert.near(window.PTPlayback.computeWaitSeconds(1, 120, 0.5), 1.0, 1e-9);
            assert.near(window.PTPlayback.computeWaitSeconds(1, 120, 2), 0.25, 1e-9);
        });

        test('advanceAnchorTime: wait/follow resets to now + waitSeconds (no drift)', () => {
            assert.near(window.PTPlayback.advanceAnchorTime(100, 50, 0.5, 'wait'), 50.5, 1e-9);
            assert.near(window.PTPlayback.advanceAnchorTime(100, 50, 0.5, 'follow'), 50.5, 1e-9);
        });
        test('advanceAnchorTime: realtime/other accumulates (drift source)', () => {
            assert.near(window.PTPlayback.advanceAnchorTime(100, 50, 0.5, 'realtime'), 100.5, 1e-9);
            assert.near(window.PTPlayback.advanceAnchorTime(100, 50, 0.5, 'idle'), 100.5, 1e-9);
        });

        test('clampTimeToWaitMs: positive when anchor ahead of now', () => {
            assert.eq(window.PTPlayback.clampTimeToWaitMs(10.5, 10), 500);
        });
        test('clampTimeToWaitMs: zero when anchor equals now', () => {
            assert.eq(window.PTPlayback.clampTimeToWaitMs(10, 10), 0);
        });
        test('clampTimeToWaitMs: clamps to zero when anchor behind now', () => {
            assert.eq(window.PTPlayback.clampTimeToWaitMs(9.5, 10), 0);
        });

        test('shouldRestartLoopAtBoundary: end reached + loop enabled → true', () => {
            assert.ok(window.PTPlayback.shouldRestartLoopAtBoundary({ isEndReached: true, currentMeasureIdx: 4, isLoopEnabled: true, maxLoop: 8 }));
        });
        test('shouldRestartLoopAtBoundary: past maxLoop + loop enabled → true', () => {
            assert.ok(window.PTPlayback.shouldRestartLoopAtBoundary({ isEndReached: false, currentMeasureIdx: 8, isLoopEnabled: true, maxLoop: 8 }));
            assert.ok(window.PTPlayback.shouldRestartLoopAtBoundary({ isEndReached: false, currentMeasureIdx: 9, isLoopEnabled: true, maxLoop: 8 }));
        });
        test('shouldRestartLoopAtBoundary: loop disabled → false at end', () => {
            assert.ok(!window.PTPlayback.shouldRestartLoopAtBoundary({ isEndReached: true, currentMeasureIdx: 8, isLoopEnabled: false, maxLoop: 8 }));
        });
        test('shouldRestartLoopAtBoundary: within bounds + loop enabled → false', () => {
            assert.ok(!window.PTPlayback.shouldRestartLoopAtBoundary({ isEndReached: false, currentMeasureIdx: 3, isLoopEnabled: true, maxLoop: 8 }));
        });
        test('shouldRestartLoopAtBoundary: maxLoop boundary (currentIdx + 1 === maxLoop + 1) is exclusive', () => {
            assert.ok(window.PTPlayback.shouldRestartLoopAtBoundary({ isEndReached: false, currentMeasureIdx: 8, isLoopEnabled: true, maxLoop: 8 }));
        });

        test('classifyNoteScheduleBranch: wait + expectedNotes + not practicing → defer (pendingAudio)', () => {
            assert.ok(window.PTPlayback.classifyNoteScheduleBranch({ mode: 'wait', expectedNotesLength: 3, isPracticingThisHand: false }));
        });
        test('classifyNoteScheduleBranch: follow + expectedNotes + not practicing → defer', () => {
            assert.ok(window.PTPlayback.classifyNoteScheduleBranch({ mode: 'follow', expectedNotesLength: 1, isPracticingThisHand: false }));
        });
        test('classifyNoteScheduleBranch: realtime → always schedule', () => {
            assert.ok(!window.PTPlayback.classifyNoteScheduleBranch({ mode: 'realtime', expectedNotesLength: 3, isPracticingThisHand: false }));
        });
        test('classifyNoteScheduleBranch: wait + no expectedNotes → schedule', () => {
            assert.ok(!window.PTPlayback.classifyNoteScheduleBranch({ mode: 'wait', expectedNotesLength: 0, isPracticingThisHand: false }));
        });
        test('classifyNoteScheduleBranch: wait + practicing this hand → schedule', () => {
            assert.ok(!window.PTPlayback.classifyNoteScheduleBranch({ mode: 'wait', expectedNotesLength: 3, isPracticingThisHand: true }));
        });

        test('shouldDeferFollowScheduling: follow + expectedNotes → defer metronome', () => {
            assert.ok(window.PTPlayback.shouldDeferFollowScheduling('follow', 3));
        });
        test('shouldDeferFollowScheduling: follow + no expectedNotes → schedule', () => {
            assert.ok(!window.PTPlayback.shouldDeferFollowScheduling('follow', 0));
        });
        test('shouldDeferFollowScheduling: wait/realtime never defer', () => {
            assert.ok(!window.PTPlayback.shouldDeferFollowScheduling('wait', 5));
            assert.ok(!window.PTPlayback.shouldDeferFollowScheduling('realtime', 5));
        });

        test('computeLoopRestartSteps: minLoop=1 → 0 steps (cursor stays at measure 0)', () => {
            assert.eq(window.PTPlayback.computeLoopRestartSteps({ minLoop: 1, totalMeasures: 10 }), 0);
        });
        test('computeLoopRestartSteps: minLoop=5 → 4 steps (0-based indexing)', () => {
            assert.eq(window.PTPlayback.computeLoopRestartSteps({ minLoop: 5, totalMeasures: 10 }), 4);
        });
        test('computeLoopRestartSteps: clamps to totalMeasures - 1 when minLoop exceeds score', () => {
            assert.eq(window.PTPlayback.computeLoopRestartSteps({ minLoop: 15, totalMeasures: 10 }), 9);
        });
        test('computeLoopRestartSteps: minLoop=0 / negative / NaN → 0 steps', () => {
            assert.eq(window.PTPlayback.computeLoopRestartSteps({ minLoop: 0, totalMeasures: 10 }), 0);
            assert.eq(window.PTPlayback.computeLoopRestartSteps({ minLoop: -1, totalMeasures: 10 }), 0);
            assert.eq(window.PTPlayback.computeLoopRestartSteps({ minLoop: NaN, totalMeasures: 10 }), 0);
        });
        test('computeLoopRestartSteps: degenerate totalMeasures=0 → 0 steps', () => {
            assert.eq(window.PTPlayback.computeLoopRestartSteps({ minLoop: 5, totalMeasures: 0 }), 0);
        });
        test('computeLoopRestartSteps: totalMeasures missing/invalid → unguarded (uses target)', () => {
            assert.eq(window.PTPlayback.computeLoopRestartSteps({ minLoop: 5 }), 4);
            assert.eq(window.PTPlayback.computeLoopRestartSteps({ minLoop: 5, totalMeasures: NaN }), 4);
        });

        test('shouldPauseAtEnd: end reached + loop disabled → pause', () => {
            assert.ok(window.PTPlayback.shouldPauseAtEnd({ isEndReached: true, isLoopEnabled: false }));
        });
        test('shouldPauseAtEnd: end reached + loop enabled → do not pause (restart path)', () => {
            assert.ok(!window.PTPlayback.shouldPauseAtEnd({ isEndReached: true, isLoopEnabled: true }));
        });
        test('shouldPauseAtEnd: not at end → do not pause', () => {
            assert.ok(!window.PTPlayback.shouldPauseAtEnd({ isEndReached: false, isLoopEnabled: false }));
            assert.ok(!window.PTPlayback.shouldPauseAtEnd({ isEndReached: false, isLoopEnabled: true }));
        });

        test('shouldAdoptMeasureTempo: tempo set and differs → adopt', () => {
            assert.ok(window.PTPlayback.shouldAdoptMeasureTempo({ TempoInBPM: 90 }, 120));
            assert.ok(window.PTPlayback.shouldAdoptMeasureTempo({ TempoInBPM: 60 }, 120));
        });
        test('shouldAdoptMeasureTempo: tempo set but matches current → no-op', () => {
            assert.ok(!window.PTPlayback.shouldAdoptMeasureTempo({ TempoInBPM: 120 }, 120));
        });
        test('shouldAdoptMeasureTempo: missing measure → false', () => {
            assert.ok(!window.PTPlayback.shouldAdoptMeasureTempo(null, 120));
            assert.ok(!window.PTPlayback.shouldAdoptMeasureTempo(undefined, 120));
        });
        test('shouldAdoptMeasureTempo: measure without TempoInBPM (missing/0) → false', () => {
            assert.ok(!window.PTPlayback.shouldAdoptMeasureTempo({}, 120));
            assert.ok(!window.PTPlayback.shouldAdoptMeasureTempo({ TempoInBPM: 0 }, 120));
            assert.ok(!window.PTPlayback.shouldAdoptMeasureTempo({ TempoInBPM: null }, 120));
        });

        test('shouldUseCountInForLoopRestart: true → defer restart to doCountInAndStart', () => {
            assert.ok(window.PTPlayback.shouldUseCountInForLoopRestart(true));
        });
        test('shouldUseCountInForLoopRestart: false / missing → restart immediately', () => {
            assert.ok(!window.PTPlayback.shouldUseCountInForLoopRestart(false));
            assert.ok(!window.PTPlayback.shouldUseCountInForLoopRestart(undefined));
            assert.ok(!window.PTPlayback.shouldUseCountInForLoopRestart(null));
            assert.ok(!window.PTPlayback.shouldUseCountInForLoopRestart(0));
        });

        test('getCombinedTieLength: null / missing note → 0', () => {
            assert.eq(window.PTPlayback.getCombinedTieLength(null), 0);
            assert.eq(window.PTPlayback.getCombinedTieLength(undefined), 0);
        });

        test('getCombinedTieLength: single note, no tie → just its length', () => {
            const note = { Length: { RealValue: 0.25 }, DotsXml: 0 };
            assert.eq(window.PTPlayback.getCombinedTieLength(note), 0.25);
        });

        test('getCombinedTieLength: single dotted note → dotted length', () => {
            const note = { Length: { RealValue: 0.25 }, DotsXml: 1 };
            assert.near(window.PTPlayback.getCombinedTieLength(note), 0.375, 1e-9);
        });

        test('getCombinedTieLength: same-pitch tie chain sums lengths from StartNote', () => {
            const n1 = { Length: { RealValue: 0.25 }, DotsXml: 0, halfTone: 60 };
            const n2 = { Length: { RealValue: 0.25 }, DotsXml: 0, halfTone: 60 };
            const n3 = { Length: { RealValue: 0.5 }, DotsXml: 0, halfTone: 60 };
            n1.tie = { Notes: [n1, n2, n3] };
            n2.tie = { Notes: [n1, n2, n3] };
            n3.tie = { Notes: [n1, n2, n3] };
            assert.near(window.PTPlayback.getCombinedTieLength(n1), 1.0, 1e-9);
            // Mid-chain: walks forward only (n2 → n3), returns chain remainder
            assert.near(window.PTPlayback.getCombinedTieLength(n2), 0.75, 1e-9);
        });

        test('getCombinedTieLength: stops at pitch change (no cross-pitch accumulation)', () => {
            const n1 = { Length: { RealValue: 0.25 }, DotsXml: 0, halfTone: 60 };
            const n2 = { Length: { RealValue: 0.25 }, DotsXml: 0, halfTone: 62 };
            n1.tie = { Notes: [n1, n2] };
            n2.tie = { Notes: [n1, n2] };
            assert.near(window.PTPlayback.getCombinedTieLength(n1), 0.25, 1e-9);
        });

        test('getCombinedTieLength: tie with no next note → just first note length', () => {
            const n1 = { Length: { RealValue: 0.5 }, DotsXml: 0, halfTone: 60 };
            n1.tie = { Notes: [n1] };
            assert.eq(window.PTPlayback.getCombinedTieLength(n1), 0.5);
        });
    });

    group('TransposeEngine.transposeXml', () => {
        function wrapScore(inner) {
            return '<?xml version="1.0" encoding="UTF-8"?>\n<score-partwise version="3.1"><part-list><score-part id="P1"><part-name>Music</part-name></score-part></part-list><part id="P1">' + inner + '</part></score-partwise>';
        }
        function findPitch(xmlString, index = 0) {
            const doc = window.TransposeEngine.parseXml(xmlString);
            const pitches = Array.from(doc.querySelectorAll('pitch'));
            const p = pitches[index];
            if (!p) return null;
            const step = p.querySelector('step').textContent;
            const octave = p.querySelector('octave').textContent;
            const alter = p.querySelector('alter')?.textContent || '0';
            return { step, octave, alter };
        }

        test('rejects non-XML', () => {
            assert.throws(() => window.TransposeEngine.transposeXml('not xml', { semitones: 2 }));
        });

        test('+1 semitone: C→C#, F→F# (sharp bias)', () => {
            const xml = wrapScore('<measure number="1"><attributes><key><fifths>0</fifths><mode>major</mode></key></attributes><note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note><note><pitch><step>F</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note></measure>');
            const out = window.TransposeEngine.transposeXml(xml, { semitones: 1 });
            assert.near(out.semitoneDelta, 1, 1e-9);
            const p0 = findPitch(out.xmlString, 0);
            const p1 = findPitch(out.xmlString, 1);
            assert.eq(p0.step, 'C');
            assert.eq(p0.alter, '1');
            assert.eq(p1.step, 'F');
            assert.eq(p1.alter, '1');
        });

        test('+1 semitone under flat bias: B→C, Bb→B, E→F', () => {
            const xml = wrapScore('<measure number="1"><attributes><key><fifths>-1</fifths><mode>major</mode></key></attributes><note><pitch><step>B</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note><note><pitch><step>B</step><alter>-1</alter><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note><note><pitch><step>E</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note></measure>');
            const out = window.TransposeEngine.transposeXml(xml, { semitones: 1 });
            const p0 = findPitch(out.xmlString, 0);
            const p1 = findPitch(out.xmlString, 1);
            const p2 = findPitch(out.xmlString, 2);
            assert.eq(p0.step, 'C');
            assert.eq(p0.alter, '0');
            assert.eq(p1.step, 'B');
            assert.eq(p1.alter, '0');
            assert.eq(p2.step, 'F');
            assert.eq(p2.alter, '0');
        });

        test('-2 semitones: D→C, Bb→Ab', () => {
            const xml = wrapScore('<measure number="1"><attributes><key><fifths>-2</fifths><mode>major</mode></key></attributes><note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note><note><pitch><step>B</step><alter>-1</alter><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note></measure>');
            const out = window.TransposeEngine.transposeXml(xml, { semitones: -2 });
            const p0 = findPitch(out.xmlString, 0);
            const p1 = findPitch(out.xmlString, 1);
            assert.eq(p0.step, 'C');
            assert.eq(p1.step, 'A');
            assert.eq(p1.alter, '-1');
        });

        test('+12 semitones: same spelling, octaves bump', () => {
            const xml = wrapScore('<measure number="1"><attributes><key><fifths>0</fifths><mode>major</mode></key></attributes><note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note></measure>');
            const out = window.TransposeEngine.transposeXml(xml, { semitones: 12 });
            const p = findPitch(out.xmlString, 0);
            assert.eq(p.step, 'C');
            assert.eq(p.alter, '0');
            assert.eq(p.octave, '5');
        });

        test('0 semitones short-circuits', () => {
            const xml = wrapScore('<measure number="1"><attributes><key><fifths>0</fifths><mode>major</mode></key></attributes><note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note></measure>');
            const out = window.TransposeEngine.transposeXml(xml, { semitones: 0 });
            assert.eq(out.semitoneDelta, 0);

        test('key mode: C major → G major (+7 fifths)', () => {
            const xml = wrapScore('<measure number="1"><attributes><key><fifths>0</fifths><mode>major</mode></key></attributes><note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note></measure>');

        test('harmony root+bass both transpose', () => {

        test('octave wrap on B → C natural upward', () => {
            const xml = wrapScore('<measure number="1"><attributes><key><fifths>0</fifths><mode>major</mode></key></attributes><note><pitch><step>B</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note></measure>');
            const out = window.TransposeEngine.transposeXml(xml, { semitones: 1 });
            const p = findPitch(out.xmlString, 0);
            assert.eq(p.step, 'C');

    // Minimal ZIP archive builder for MXL parser tests. Supports stored (method 0)
// entries only. Enough to exercise listZipEntries, extractZipEntryText, and the
// full extractMusicXml flow without depending on external files.
// CRC_TABLE + crc32 are defined at the top of runTests so sync test() calls can reach them.

    function buildZip(files) {
        const enc = new TextEncoder();
        const localChunks = [];
        const centralChunks = [];
        let offset = 0;

        for (const file of files) {
            const nameBytes = enc.encode(file.name);
            const data = file.method === 0 ? file.data : file.data; // deflate tested via CompressionStream
            const compressed = file.method === 0 ? data : null; // produced below when needed
            const crc = crc32(data);

            const localHeader = new Uint8Array(30 + nameBytes.length);
            const lv = new DataView(localHeader.buffer);
            lv.setUint32(0, 0x04034b50, true);
            lv.setUint16(4, 20, true);
            lv.setUint16(6, 0, true);
            lv.setUint16(8, file.method, true);
            lv.setUint16(10, 0, true);
            lv.setUint16(12, 0, true);
            lv.setUint32(14, crc, true);
            lv.setUint32(18, file.method === 0 ? data.length : 0, true);
            lv.setUint32(22, data.length, true);
            lv.setUint16(26, nameBytes.length, true);
            lv.setUint16(28, 0, true);
            localHeader.set(nameBytes, 30);
            localChunks.push(localHeader, data);

            const centralHeader = new Uint8Array(46 + nameBytes.length);
            const cv = new DataView(centralHeader.buffer);
            cv.setUint32(0, 0x02014b50, true);
            cv.setUint16(4, 20, true);
            cv.setUint16(6, 20, true);
            cv.setUint16(8, 0, true);
            cv.setUint16(10, file.method, true);
            cv.setUint16(12, 0, true);
            cv.setUint16(14, 0, true);
            cv.setUint32(16, crc, true);
            cv.setUint32(20, file.method === 0 ? data.length : 0, true);
            cv.setUint32(24, data.length, true);
            cv.setUint16(28, nameBytes.length, true);
            cv.setUint16(30, 0, true);
            cv.setUint16(32, 0, true);
            cv.setUint16(34, 0, true);
            cv.setUint16(36, 0, true);
            cv.setUint32(38, 0, true);
            cv.setUint32(42, offset, true);
            centralHeader.set(nameBytes, 46);
            centralChunks.push(centralHeader);

            offset += localHeader.length + data.length;
        }

        const centralDirSize = centralChunks.reduce((s, c) => s + c.length, 0);
        const centralDirOffset = offset;

        const eocd = new Uint8Array(22);
        const ev = new DataView(eocd.buffer);
        ev.setUint32(0, 0x06054b50, true);
        ev.setUint16(4, 0, true);
        ev.setUint16(6, 0, true);
        ev.setUint16(8, files.length, true);
        ev.setUint16(10, files.length, true);
        ev.setUint32(12, centralDirSize, true);
        ev.setUint32(16, centralDirOffset, true);
        ev.setUint16(20, 0, true);

        const all = [...localChunks, ...centralChunks, eocd];
        const totalLen = all.reduce((s, c) => s + c.length, 0);
        const merged = new Uint8Array(totalLen);
        let p = 0;
        for (const c of all) { merged.set(c, p); p += c.length; }
        return merged.buffer;
    }

    function loadOsmd(xml) {
        const container = document.getElementById('osmd-test-container');
        const o = new opensheetmusicdisplay.OpenSheetMusicDisplay(container, { autoResize: false });
        return o.load(xml).then(() => { o.render(); o.cursor.show(); o.cursor.reset(); return o; });
    }

    function collectVoiceEntries(osmd) {
        const out = [];
        let safety = 0;
        while (!osmd.cursor.Iterator.EndReached && safety < 2000) {
            const entries = osmd.cursor.Iterator.CurrentVoiceEntries || [];
            for (const entry of entries) {
                for (const note of (entry.Notes || [])) {
                    out.push({
                        note, entry,
                        mIdx: osmd.cursor.Iterator.CurrentMeasureIndex,
                        timestamp: osmd.cursor.Iterator.currentTimeStamp.RealValue
                    });
                }
            }
            osmd.cursor.Iterator.moveToNext();
            safety++;
        }
        return out;
    }

            '<note><pitch><step>C</step><octave>4</octave></pitch><duration>2</duration><type>half</type></note>' +
            '</measure>' +
            '<measure number="2"><attributes><key><fifths>0</fifths></key><time><beats>2</beats><beat-type>4</beat-type></time></attributes>' +
            '<note><pitch><step>D</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>' +
            '<note><pitch><step>E</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>' +
            '<barline location="right"><ending number="1" type="start"/><repeat direction="backward"/></barline>' +
            '</measure>' +
            '<measure number="3"><attributes><key><fifths>0</fifths></key><time><beats>2</beats><beat-type>4</beat-type></time></attributes>' +
            '<note><pitch><step>F</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>' +
            '<note><pitch><step>G</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>' +
            '<barline location="right"><ending number="2" type="stop"/><repeat direction="backward"/></barline>' +
            '</measure>'
        );
        return loadOsmd(xml).then(o => {
            const notes = collectVoiceEntries(o);
            const m1 = notes.filter(n => n.mIdx === 1);
            const m2 = notes.filter(n => n.mIdx === 2);
            assert.ok(m1.length > 0, 'first ending visited at least once');
            assert.ok(m2.length > 0, 'second ending visited at least once');
        });
    });

    // Helper integration: dotted length math + tie shape on real OSMD notes
    __osmdTests.push(() => {
        const xml = wrapFullScore(
            '<measure number="1"><attributes><divisions>1</divisions><key><fifths>0</fifths><mode>major</mode></key><time><beats>4</beats><beat-type>4</beat-type></time></attributes>' +
            '<note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type><dot/></note>' +
            '<note><pitch><step>D</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>' +
            '</measure>'
        );
        return loadOsmd(xml).then(o => {
            const notes = collectVoiceEntries(o);
            assert.near(window.PTHelpers.getNoteEffectiveLength(notes[0].note), 0.375, 1e-9, 'dotted quarter via OSMD');
            assert.near(window.PTHelpers.getNoteEffectiveLength(notes[1].note), 0.25, 1e-9, 'plain quarter via OSMD');
        });
    });

    __osmdTests.push(() => {
        const xml = wrapFullScore(
            '<measure number="1"><attributes><divisions>1</divisions><key><fifths>0</fifths><mode>major</mode></key><time><beats>4</beats><beat-type>4</beat-type></time></attributes>' +
            '<note><pitch><step>C</step><octave>4</octave></pitch><duration>2</duration><type>half</type><notations><tied type="start"/></notations></note>' +
            '<note><pitch><step>C</step><octave>4</octave></pitch><duration>2</duration><type>half</type><notations><tied type="stop"/></notations></note>' +
            '</measure>'
        );
        return loadOsmd(xml).then(o => {
            const notes = collectVoiceEntries(o);
            const tieA = window.PTHelpers.getNoteTie(notes[0].note);
            const tieB = window.PTHelpers.getNoteTie(notes[1].note);
            assert.ok(tieA, 'first note has tie');
            assert.ok(tieB, 'second note has tie');
            assert.eq(tieA.StartNote, notes[0].note);
            assert.eq(tieA.EndNote, notes[1].note);
            assert.eq(tieB.NextNote, null);
            assert.eq(tieA.NextNote, notes[1].note);
        });
    });

    __osmdTests.forEach(fn => testAsync('OSMD: ' + (fn.name || fn.toString().slice(0, 60)), fn));

    return __asyncPromises.length ? Promise.allSettled(__asyncPromises) : Promise.resolve();
}

const __asyncPromises = [];
function testAsync(name, fn) {
    const p = Promise.resolve()
        .then(fn)
        .then(() => {
            __passed++;
            __results.push({ group: __currentGroup, name, pass: true });
        })
        .catch(e => {
            __failed++;
            __results.push({ group: __currentGroup, name, pass: false, err: String(e && e.stack || e) });
        });
    __asyncPromises.push(p);
}

function render() {
    const meta = document.getElementById('meta');
    const sum = document.getElementById('summary');
    const out = document.getElementById('results');
    out.innerHTML = '';

    const groups = {};
    for (const r of __results) (groups[r.group] ||= []).push(r);

    sum.className = 'summary ' + (__failed ? 'fail' : 'pass');
    sum.textContent = __failed
        ? (__failed + ' failed, ' + __passed + ' passed')
        : ('All ' + __passed + ' tests passed');

    for (const [gname, items] of Object.entries(groups)) {
        const h = document.createElement('h2');
        h.textContent = gname;
        out.appendChild(h);
        const ol = document.createElement('ol');
        ol.className = 'tests';
        for (const r of items) {
            const li = document.createElement('li');
            li.className = 'test ' + (r.pass ? 'pass' : 'fail');
            li.innerHTML = '<span class="name">' + (r.pass ? '✓' : '✗') + ' ' + r.name + '</span>'
                + (r.err ? '<span class="err">' + r.err + '</span>' : '');
            ol.appendChild(li);
        }
        out.appendChild(ol);
    }
    meta.textContent = 'Modules: PTHelpers, PTTiming, TransposeEngine, PTFullscreen, PTMode, PTTransport, PTLooperState, PTPlayback, PTKeyboardInput. ' + new Date().toLocaleTimeString();
}

async function main() {
    document.getElementById('rerun').addEventListener('click', async () => { await runTests(); render(); });
    try {
        await loadModules();
        await runTests();
        render();
    } catch (e) {
        document.getElementById('summary').className = 'summary fail';
        document.getElementById('summary').textContent = 'Load failure: ' + e.message;
    }
}

main();
</script>
